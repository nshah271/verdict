# Release workflow: build sdist + wheel on a `v*` tag push and publish
# to PyPI via Trusted Publishing (OIDC). No PyPI API token needed once
# the trusted publisher is registered.
#
# Bootstrap (one time only, before this workflow can publish):
#   1. Manually publish v0.1.0 from a laptop with a PyPI API token
#      (see RELEASING.md). This claims the `myverdict` name on PyPI.
#   2. On pypi.org, project `myverdict` -> Settings -> Publishing,
#      add this repo (`nshah271/verdict`), workflow `release.yml`,
#      environment name `pypi` (or leave empty), publish job name `publish`.
#   3. After that, every `git push --tags` for a new `vX.Y.Z` tag
#      publishes automatically through this workflow.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches pyproject version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PROJECT_VERSION."
            exit 1
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: |
          pip install --upgrade build
          python -m build

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Needed for PyPI Trusted Publishing (OIDC token exchange).
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/myverdict/${{ needs.build.outputs.version }}/
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
