name: 'Verdict AI Code Audit'
description: 'Static analysis tool that catches AI coding agents lying about what they implemented'
author: 'nshah271'

inputs:
  fail-on:
    description: 'Threshold for failure (suspicious | lied)'
    required: false
    default: 'lied'
  static-only:
    description: 'Skip dynamic checks for faster CI runs'
    required: false
    default: 'false'
  diff-range:
    description: 'Git diff range to audit'
    required: false
    default: 'origin/main...HEAD'

runs:
  using: 'composite'
  steps:
    - name: Install verdict-ai
      shell: bash
      run: |
        # Editable install so the package's file paths point at the workspace
        # source. The trace and coverage_delta checks match diff-derived line
        # numbers against runtime co_filename, which only aligns when the
        # installed package and the diff source are the same files on disk.
        pip install -e "${{ github.action_path }}"

    - name: Run verdict audit
      shell: bash
      run: |
        ARGS="--fail-on ${{ inputs.fail-on }} --diff-range ${{ inputs.diff-range }}"

        if [ "${{ inputs.static-only }}" = "true" ]; then
          ARGS="$ARGS --static-only"
        fi

        verdict run $ARGS

branding:
  icon: 'shield'
  color: 'blue'

